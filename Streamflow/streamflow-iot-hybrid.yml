# StreamFlow deployment: IoT pipeline across the continuum.
#   Edge layer  (device_pipeline) -> Ubuntu server via SSH
#   Cloud layer (cloud_aggregate) -> local Docker
#
# Fill in your server hostname, username, and SSH key path before running.
version: v1.0
models:
  docker-python:
    type: docker
    config:
      image: python:3.12
      volume:
        - "/tmp/streamflow:/tmp/streamflow"
  ubuntu-server:
    type: ssh
    config:
      nodes:
        - hostname: <UBUNTU_SERVER_HOST>
      username: <UBUNTU_SERVER_USER>
      sshKey: ~/.ssh/id_rsa
      checkHostKey: false
workflows:
  iot-pipeline:
    type: cwl
    config:
      file: workflows/04_iot_pipeline.cwl
    bindings:
      - step: /device_pipeline
        target:
          model: ubuntu-server
      - step: /cloud_aggregate
        target:
          model: docker-python
