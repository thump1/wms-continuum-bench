apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: continuum
servers: 1
agents: 2
volumes:
  - volume: /tmp/k3d-nf-work:/nf-work
    nodeFilters:
      - all
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:0
    nodeLabels:
      - label: continuum-tier=control
        nodeFilters:
          - server:0
      - label: continuum-tier=cloud
        nodeFilters:
          - agent:0
      - label: continuum-tier=edge
        nodeFilters:
          - agent:1
